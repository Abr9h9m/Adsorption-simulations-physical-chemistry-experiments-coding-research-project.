# --------------------------------------------------------------- ionic conditions
# Built per curve from the data (not from a table).
condition_schemes:
  ionic_strength_band:        # mol/L, from the corrected ionic strength
    bins: [0.0, 0.01, 0.1, .inf]
    labels: [low_below_0.01M, medium_0.01_to_0.1M, high_above_0.1M]
  background_anion:           # which simple anion carries the background salt
    members:
      Cl(-1): chloride
      N(+5): nitrate
      Cl(+7): perchlorate
    none_label: no_simple_anion
    mixed_label: mixed
  carbonate: co2_present      # True/False column from load.py
  cosolute: has_cosolute      # True/False column from curves.py

# --------------------------------------------------------------- testing
testing:
  parameters: [edge_pH, log_width, height]   # scheme tests; the property screen uses edge_pH only
  min_curves_per_group: 5     # groups with fewer curves are merged into `other` for that scheme
  fdr: benjamini_hochberg
  alpha: 0.05
