# EXPLORATORY grouping schemes for Stage 2 (added 2026-10-12 at Samuel's request).
# The spec's pre-specified classes stay in classes.yaml; everything here is a
# second look, reported with false-discovery-rate correction, never used for the
# Stage 2 go/no-go. All assignments below are PROPOSED (Claude) and unconfirmed.
# Written before any Stage 2 result existed. Changing them after seeing results
# must be recorded (spec section 13).

# --------------------------------------------------------------- minerals
# Source: Samuel's mineral property table (true/false per property).
mineral_properties:
  file: "phslope/mineral properties.csv"
  # Cell codes other than T and F (TO 46 cells, O 24, FO 7). Meaning not yet
  # confirmed (OPEN_QUESTIONS 16). Default: only T counts as true, only F as
  # false; TO / O / FO are treated as missing for that property.
  true_codes: [T]
  false_codes: [F]
  # Name differences between the table and the data (spelling only).
  aliases:
    fluorapatite: fluoroapatite
    lepidocrocite: lepidocrosite
    hydrous aluminium oxide: hydrous aluminum oxide
  # Rows with entries that contradict the mineral's formula. Left out of every
  # property-based grouping until Samuel corrects them (values are never fixed
  # here). See OPEN_QUESTIONS 16.
  exclude_rows:
    Calcite: "Carbonate minerals = F, but calcite is CaCO3"
    Maghemite: "Manganese-containing = T and Iron-containing = F, but maghemite is gamma-Fe2O3"
    Corundum: "Framework silicates = T, but corundum is Al2O3 (not a silicate)"
  # One two-group split per property column (T vs F) is screened, if each side
  # has at least this many minerals with curves.
  min_minerals_per_side: 2

# Categorical schemes built from the property table: a mineral gets the label
# of the FIRST property in the list that is T for it, otherwise `other`.
mineral_schemes:
  mineral_metal:
    from_properties:
      Silicates: silicate
      Iron-containing: iron
      Manganese-containing: manganese
      Titanium-containing: titanium
      Zirconium-containing: zirconium
      Aluminum-containing: aluminum
      Calcium-containing: calcium
      Magnesium-containing: magnesium
  mineral_structure:
    from_properties:
      Clay minerals: clay
      Zeolite group: zeolite
      Framework silicates (tectosilicates): framework_silicate
      Sheet silicates (phyllosilicates): sheet_silicate
      Carbonate minerals: carbonate
      Phosphate minerals: phosphate
      Oxyhydroxides: oxyhydroxide
      Hydroxides: hydroxide
      Oxides: oxide
      Dioxides (MO2): oxide

