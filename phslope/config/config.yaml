# phslope run configuration. Changing any value changes the config hash
# recorded next to every output (see phslope/common.py).

data:
  # Precedence: --data CLI flag > SORPTION_DATA_FILE env var > this value
  # (null = fall back to data_audit.CONFIG["DATA_FILE"]).
  file: null

response:
  mode: fraction_sorbed        # or log_kd
  # Section 2: a curve is flagged unit_mismatch if more than max_out_of_range_frac
  # of its fraction-sorbed values are above upper or below lower.
  upper: 1.05
  lower: -0.05
  max_out_of_range_frac: 0.05

ph:
  valid_min: 0.0               # rows outside [valid_min, valid_max] get bad_ph = True
  valid_max: 14.0

curves:
  # A Set is a candidate pH curve if it has at least min_ph_levels distinct pH
  # values (rounded to ph_round decimals) and a pH span of at least min_span.
  min_ph_levels: 3
  ph_round: 2
  min_span: 1.0
  # Electrolyte-signature members treated as plain background electrolyte.
  # Anything else in a curve's signature (e.g. P(+5), S(+6), Humic acid, a
  # second sorbate) sets has_cosolute = True. Scientific choice: see OPEN_QUESTIONS.md.
  background_ions: ["Na(+1)", "K(+1)", "Li(+1)", "Cl(-1)", "Cl(+7)", "N(+5)", "Ca(+2)", "Mg(+2)", "Cs(+1)", "Br(-1)", "I(-1)"]

grid:
  ph_min: 2.0
  ph_max: 11.0
  step: 0.25

census:
  dense_block_minerals: 12     # gap list looks at the top-N minerals x top-N sorbates by usable points
  dense_block_sorbates: 12

seeds:
  global: 20261012

bootstrap:
  B: 200

fit:                           # 4-parameter logistic edge fit (spec 4.2)
  n_starts: 20
  bootstrap_starts: 3          # bootstrap refits start from the full fit + (n-1) random starts
  w_min: 0.05
  w_max: 3.0
  level_min: -0.1
  level_max: 1.1
  p50_pad: 1.0                 # p50 bounded to observed pH range +/- this

smooth:                        # penalised cubic spline (spec 4.3)
  lam_min: 1.0e-5              # roughness-penalty grid, log-spaced; chosen by leave-one-pH-level-out CV
  lam_max: 1.0e+3
  lam_n: 25
  min_unique_ph: 5             # make_smoothing_spline needs >= 5 distinct x
  ph_decimals: 2               # replicates = same pH after rounding; averaged (weighted) before fitting

shape:                         # shape classification (spec 4.5); scientific choices, see phslope/README.md
  dense_n: 200
  flat_height: 0.15            # fitted response range below this -> flat
  min_step: 0.15               # a rise or fall must change the response by at least this to count
  multi_step_valley: 0.3       # two slope peaks separated by a valley below this fraction of the smaller peak
  multi_step_min_sep: 1.5      # ... and at least this many pH units apart
  edge_track_window: 1.0       # smoother bootstrap draws follow the full-fit edge within +/- this many pH units

stage1:
  workers: 8
  diagnostics_pdf: true
