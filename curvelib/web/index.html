<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curve Library</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.27.0/plotly.min.js"></script>
<style>
:root { --bg:#fcfcfb; --fg:#0b0b0b; --muted:#52514e; --line:#e3e2dd; --card:#ffffff; --accent:#2a78d6;
        --warn-bg:#fff4e0; --warn-fg:#6b4500; --empty:#efeee9; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#1a1a19; --fg:#f0efec; --muted:#c3c2b7; --line:#3a3a37; --card:#232322; --accent:#3987e5;
  --warn-bg:#3a2e14; --warn-fg:#f5d79a; --empty:#2c2c2a; } }
:root[data-theme="dark"] { --bg:#1a1a19; --fg:#f0efec; --muted:#c3c2b7; --line:#3a3a37; --card:#232322;
  --accent:#3987e5; --warn-bg:#3a2e14; --warn-fg:#f5d79a; --empty:#2c2c2a; }
* { box-sizing: border-box; }
body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
header { padding:10px 16px; border-bottom:1px solid var(--line); }
.banner { background:var(--warn-bg); color:var(--warn-fg); padding:6px 16px; font-size:13px; }
nav button { margin-right:6px; padding:6px 10px; border:1px solid var(--line); background:var(--card); color:var(--fg);
             border-radius:6px; cursor:pointer; }
nav button[aria-selected="true"] { border-color:var(--accent); color:var(--accent); font-weight:600; }
main { padding:12px 16px; max-width:1200px; margin:0 auto; }
section[hidden] { display:none; }
.ptable { display:grid; grid-template-columns:repeat(18, minmax(0,1fr)); gap:3px; max-width:900px; }
.cell { aspect-ratio:1; border:1px solid var(--line); border-radius:4px; font-size:11px; padding:2px; text-align:center;
        background:var(--empty); color:var(--muted); display:flex; flex-direction:column; justify-content:center; }
.cell.has { cursor:pointer; color:#0b0b0b; }
.cell.has:focus, .cell.has:hover { outline:2px solid var(--accent); }
.cell .sym { font-weight:700; font-size:12px; }
.cell .n { font-size:9px; }
.gap { aspect-ratio:1; }
.row { display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start; }
.panel { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px; margin:10px 0; flex:1 1 300px; }
table { border-collapse:collapse; font-size:12px; width:100%; }
th, td { border-bottom:1px solid var(--line); padding:3px 6px; text-align:left; }
.warn { background:var(--warn-bg); color:var(--warn-fg); padding:6px; border-radius:6px; margin:6px 0; }
label { margin-right:10px; }
input[type=number] { width:90px; }
.muted { color:var(--muted); }
@media (max-width: 640px) { .ptable { gap:1px; } .cell .n { display:none; } .cell .sym { font-size:9px; } }
</style>
</head>
<body>
<div class="banner" id="banner">Loading…</div>
<header>
  <strong>Curve Library</strong> <span class="muted" id="title"></span>
  <nav role="tablist" style="margin-top:8px">
    <button role="tab" data-tab="picker" aria-selected="true">Elements</button>
    <button role="tab" data-tab="coverage" aria-selected="false">Coverage</button>
    <button role="tab" data-tab="viewer" aria-selected="false">Curves</button>
    <button role="tab" data-tab="predict" aria-selected="false">Predict</button>
  </nav>
</header>
<main>
<section id="picker">
  <p class="muted">Colour = amount of data (log scale). Elements with no data are greyed. Click an element.</p>
  <label>Colour by <select id="metric"></select></label>
  <div id="ptable" class="ptable" style="margin-top:8px"></div>
  <div class="row">
    <div class="panel" id="selection"><em class="muted">No element selected.</em></div>
    <div class="panel"><strong>Other sorbates (not elements)</strong><div id="other"></div></div>
  </div>
  <details class="panel"><summary>Table view of the counts</summary><div id="counts"></div></details>
</section>
<section id="coverage" hidden>
  <label>min points <input type="number" id="minp" value="50"></label>
  <label>min papers <input type="number" id="minc" value="2"></label>
  <button id="covgo">Update</button>
  <div id="covsummary" class="muted"></div>
  <div id="heatmap" style="height:640px"></div>
</section>
<section id="viewer" hidden>
  <div id="vsel" class="muted">Select curves from the Elements tab.</div>
  <div id="plot" style="height:440px"></div>
  <button id="fitgo">Fit logistic to the shown curves</button>
  <div id="fitout"></div>
</section>
<section id="predict" hidden>
  <div class="panel">
    <label>mineral <input id="pm" value="goethite"></label>
    <label>sorbate <input id="ps" value="U(+6)"></label>
    <label>solids g/L <input type="number" id="psol" value="1" step="any"></label>
    <label>total mol/L <input type="number" id="ptot" value="0.000001" step="any"></label>
    <label>ionic strength mol/L <input type="number" id="pI" value="0.1" step="any"></label>
    <button id="predgo">Predict</button>
  </div>
  <div id="prednotes"></div>
  <div id="predplot" style="height:420px"></div>
</section>
</main>
<script>
const api = (p) => fetch(p).then(r => r.ok ? r.json() : r.json().then(e => { throw new Error(e.detail || r.status); }));
let PICK = null, SELECTED = [];
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-selected", x === b));
  document.querySelectorAll("main section").forEach(s => s.hidden = s.id !== b.dataset.tab);
  if (b.dataset.tab === "coverage") drawCoverage();
});

function color(v, max) {               // sequential blue, log scale
  if (!v) return null;
  const t = Math.log10(v + 1) / Math.log10(max + 1);
  const l = 92 - t * 55;
  return `hsl(212, 70%, ${l}%)`;
}

async function init() {
  const m = await api("/api/meta");
  document.getElementById("banner").textContent =
    `Status: ${m.status.toUpperCase()} · schema v${m.schema_version} · data ${m.data_version} · ${m.data.rows.toLocaleString()} rows. ` +
    `Uncertainty is shown at paper level; the locked test papers are never used to fit the model.`;
  document.getElementById("title").textContent = m.data.title;
  const e = await api("/api/entities");
  PICK = e.data;
  const sel = document.getElementById("metric");
  (PICK.metrics || ["curves"]).forEach(k => sel.add(new Option(k.replace(/_/g, " "), k)));
  sel.onchange = drawTable;
  drawTable();
  document.getElementById("other").innerHTML = "<table><tr><th>label</th><th>curves</th><th>papers</th></tr>" +
    (PICK.other || []).map(o => `<tr><td>${esc(o.label)}</td><td>${o.curves}</td><td>${o.papers}</td></tr>`).join("") + "</table>";
}

function drawTable() {
  const k = document.getElementById("metric").value;
  const cells = PICK.cells, max = Math.max(...cells.map(c => c[k] || 0));
  const grid = document.getElementById("ptable");
  grid.innerHTML = "";
  const at = {}; cells.forEach(c => at[`${c.row},${c.col}`] = c);
  for (let r = 1; r <= 10; r++) for (let col = 1; col <= 18; col++) {
    const c = at[`${r},${col}`];
    if (!c) { const g = document.createElement("div"); g.className = "gap"; grid.appendChild(g); continue; }
    const d = document.createElement(c.has_data ? "button" : "div");
    d.className = "cell" + (c.has_data ? " has" : "");
    if (c.has_data) { d.style.background = color(c[k], max); d.onclick = () => selectElement(c);
      d.title = `${c.id}: ${c.points} points, ${c.curves} curves, ${c.papers} papers, ${c.minerals} minerals`;
      d.setAttribute("aria-label", d.title); }
    d.innerHTML = `<span class="sym">${c.id}</span>` + (c.has_data ? `<span class="n">${c[k]}</span>` : "");
    grid.appendChild(d);
  }
  const rows = cells.filter(c => c.has_data).sort((a, b) => b[k] - a[k]);
  document.getElementById("counts").innerHTML = "<table><tr><th>element</th>" +
    PICK.metrics.map(m => `<th>${m.replace(/_/g, " ")}</th>`).join("") + "</tr>" +
    rows.map(c => `<tr><td>${c.id}</td>` + PICK.metrics.map(m => `<td>${c[m]}</td>`).join("") + "</tr>").join("") + "</table>";
}

async function selectElement(c) {
  const qs = c.members.map(m => "group_b=" + encodeURIComponent(m)).join("&");
  const r = await api("/api/curves?" + qs);
  const curves = r.data;
  const byMineral = {};
  curves.forEach(x => (byMineral[x.group_a] = byMineral[x.group_a] || []).push(x));
  const p = document.getElementById("selection");
  p.innerHTML = `<strong>${esc(c.id)}</strong>: ${curves.length} clean curves. Oxidation states / forms: ` +
    c.members.map(m => `<label><input type="checkbox" class="ox" value="${esc(m)}" checked> ${esc(m)}</label>`).join("") +
    "<table><tr><th>mineral</th><th>curves</th><th>papers</th><th></th></tr>" +
    Object.entries(byMineral).sort((a, b) => b[1].length - a[1].length).map(([mn, cs]) =>
      `<tr><td>${esc(mn)}</td><td>${cs.length}</td><td>${new Set(cs.map(x => x.cluster)).size}</td>` +
      `<td><button data-m="${esc(mn)}">show</button></td></tr>`).join("") + "</table>";
  p.querySelectorAll("button[data-m]").forEach(b => b.onclick = () => {
    const ox = [...p.querySelectorAll(".ox:checked")].map(x => x.value);
    SELECTED = byMineral[b.dataset.m].filter(x => ox.includes(x.group_b));
    document.querySelector('nav button[data-tab="viewer"]').click();
    drawCurves();
  });
}

async function drawCurves() {
  if (!SELECTED.length) return;
  const qs = SELECTED.slice(0, 60).map(x => "curve_id=" + encodeURIComponent(x.curve_id)).join("&");
  const r = await api("/api/points?" + qs);
  const pts = r.data, byCluster = {};
  pts.forEach(p => (byCluster[p.Reference ?? p.curve_id] = byCluster[p.Reference ?? p.curve_id] || []).push(p));
  const traces = Object.entries(byCluster).map(([k, ps]) => ({x: ps.map(p => p.x), y: ps.map(p => p.y), mode: "markers",
    type: "scattergl", name: k, text: ps.map(p => Object.entries(p).filter(([a]) => !["x","y"].includes(a))
      .map(([a, v]) => `${a}: ${v}`).join("<br>")), hoverinfo: "text+x+y"}));
  const s = SELECTED[0];
  document.getElementById("vsel").textContent = `${s.group_a} · ${[...new Set(SELECTED.map(x => x.group_b))].join(", ")} · ` +
    `${SELECTED.length} curves, ${Object.keys(byCluster).length} papers (one colour per paper)`;
  Plotly.newPlot("plot", traces, {xaxis: {title: "pH"}, yaxis: {title: "fraction sorbed"}, margin: {t: 20},
    paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)"}, {responsive: true});
}

document.getElementById("fitgo").onclick = async () => {
  if (!SELECTED.length) return;
  const qs = SELECTED.slice(0, 60).map(x => "curve_id=" + encodeURIComponent(x.curve_id)).join("&");
  try {
    const f = (await api("/api/fit?" + qs)).data;
    Plotly.addTraces("plot", {x: f.curve.x, y: f.curve.y, mode: "lines", name: "logistic fit", line: {width: 3}});
    const iv = f.intervals || {};
    document.getElementById("fitout").innerHTML = (f.warning ? `<div class="warn">${esc(f.warning)}</div>` : "") +
      `<table><tr><th>n points</th><th>papers</th><th>curves</th><th>R² (fraction space)</th><th>RMSE</th><th>window</th></tr>` +
      `<tr><td>${f.n_points}</td><td>${f.n_clusters}</td><td>${f.n_curves}</td><td>${f.r2_response_space?.toFixed(3)}</td>` +
      `<td>${f.rmse.toFixed(3)}</td><td>${f.fit_window.map(v => v.toFixed(2)).join("–")}</td></tr></table>` +
      "<table><tr><th>parameter</th><th>value</th><th>95% interval (papers resampled)</th></tr>" +
      Object.entries(f.params).map(([k, v]) => `<tr><td>${k}</td><td>${v.toFixed(3)}</td><td>${iv[k] ? iv[k].map(x => x.toFixed(2)).join(" – ") : "single paper: n/a"}</td></tr>`).join("") + "</table>";
  } catch (e) { document.getElementById("fitout").innerHTML = `<div class="warn">${esc(e.message)}</div>`; }
};

async function drawCoverage() {
  const r = await api(`/api/coverage?min_points=${minp.value}&min_clusters=${minc.value}`);
  const t = r.data, A = [...new Set(t.map(x => x.group_a))].sort(), B = [...new Set(t.map(x => x.group_b))].sort();
  const z = A.map(a => B.map(b => { const c = t.find(x => x.group_a === a && x.group_b === b); return c ? c.clusters : null; }));
  const txt = A.map(a => B.map(b => { const c = t.find(x => x.group_a === a && x.group_b === b);
    return c ? `${a} · ${b}<br>${c.points} points, ${c.curves} curves, ${c.clusters} papers<br>${c.passes ? "passes" : "below thresholds"}` : ""; }));
  document.getElementById("covsummary").textContent = `${t.filter(x => x.passes).length} of ${t.length} pairs pass (colour = number of papers).`;
  Plotly.newPlot("heatmap", [{z, x: B, y: A, type: "heatmap", colorscale: "Blues", text: txt, hoverinfo: "text"}],
    {margin: {l: 140, b: 120, t: 10}, paper_bgcolor: "rgba(0,0,0,0)"}, {responsive: true});
}
document.getElementById("covgo").onclick = drawCoverage;

document.getElementById("predgo").onclick = async () => {
  const q = new URLSearchParams({group_a: pm.value, group_b: ps.value, solids_g_L: psol.value,
                                 total_sorbate_mol_L: ptot.value, ionic_strength: pI.value});
  try {
    const d = (await api("/api/predict?" + q)).data;
    document.getElementById("prednotes").innerHTML = d.notes.map(n => `<div class="warn">${esc(n)}</div>`).join("") +
      `<p>Edge (50% sorbed): pH ${d.edge_pH.toFixed(2)} (90% range for a new paper ${d.edge_lo.toFixed(2)}–${d.edge_hi.toFixed(2)}).</p>`;
    Plotly.newPlot("predplot", [
      {x: d.grid, y: d.fraction_upper, mode: "lines", line: {width: 0}, showlegend: false},
      {x: d.grid, y: d.fraction_lower, mode: "lines", fill: "tonexty", line: {width: 0}, name: "95% range (new paper)"},
      {x: d.grid, y: d.fraction, mode: "lines", name: "predicted fraction sorbed", line: {width: 3}}],
      {xaxis: {title: "pH"}, yaxis: {title: "fraction sorbed", range: [0, 1]}, margin: {t: 20}, paper_bgcolor: "rgba(0,0,0,0)"},
      {responsive: true});
  } catch (e) { document.getElementById("prednotes").innerHTML = `<div class="warn">${esc(e.message)}</div>`; }
};

init().catch(e => document.getElementById("banner").textContent = "Error: " + e.message);
</script>
</body>
</html>
